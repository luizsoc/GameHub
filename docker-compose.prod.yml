# Production overrides, used on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Preparation only: TLS, the public domain and serving the frontend belong to
# the reverse proxy in front of the API (see README, "Preparação para
# produção"). Every value below is required: no development fallbacks. Put
# them in the server's .env or secret store, never in the repository.

x-backend-environment: &backend-environment
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=gamehub;Username=gamehub;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  Jwt__Key: ${JWT_KEY:?JWT_KEY is required (a new key, never the development one)}
  Jwt__Issuer: ${JWT_ISSUER:?JWT_ISSUER is required}
  Jwt__Audience: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
  # Public host name(s), ';'-separated; localhost stays for the container
  # healthcheck.
  AllowedHosts: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required};localhost"
  # Network (CIDR) the reverse proxy connects from, so its X-Forwarded-For and
  # X-Forwarded-Proto headers are trusted.
  ForwardedHeaders__KnownNetworks__0: ${FORWARDED_KNOWN_NETWORK:?FORWARDED_KNOWN_NETWORK is required}

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Not published: only containers on the compose network reach it.
    ports: !reset []

  migrate:
    environment: *backend-environment

  api:
    environment: *backend-environment
